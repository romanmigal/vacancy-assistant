name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]      # в ubuntu-latest (26.04) нет Python 3.9
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Тесты
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v
      - name: Командная строка
        run: |
          python razbor.py help
          python razbor.py --profile example summary
          python razbor.py --profile example prompt
        env:
          VACANCY_ASSISTANT_HOME: tests/fixtures      # тестовый профиль; своих профилей в репозитории нет
