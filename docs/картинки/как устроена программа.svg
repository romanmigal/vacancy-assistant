<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Как устроен «Помощник по вакансиям»</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #1d2430; --muted: #5b6573; --line: #8a94a3;
      --app-bg: #eef3f8; --app-bd: #1f4e79;
      --here-bg: #eef7f0; --here-bd: #2f7a45;
      --net-bg: #fdf3e7; --net-bd: #b06a1b;
      --sub-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191f; --ink: #e6e9ee; --muted: #a3acb9; --line: #7d8796;
        --app-bg: #1b2a3a; --app-bd: #6fa8dc;
        --here-bg: #1a2a20; --here-bd: #6cc28a;
        --net-bg: #2e2416; --net-bd: #e0a35a;
        --sub-bg: #1f232b;
      }
    }
    .bg { fill: var(--bg); }
    .title { fill: var(--ink); font-size: 22px; font-weight: 700; }
    .h { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .hs { fill: var(--ink); font-size: 13px; font-weight: 600; }
    .t { fill: var(--ink); font-size: 13px; }
    .m { fill: var(--muted); font-size: 12px; }
    .lbl { fill: var(--muted); font-size: 11.5px; }
    .app { fill: var(--app-bg); stroke: var(--app-bd); stroke-width: 1.5; }
    .here { fill: var(--here-bg); stroke: var(--here-bd); stroke-width: 1.5; }
    .net { fill: var(--net-bg); stroke: var(--net-bd); stroke-width: 1.5; }
    .sub { fill: var(--sub-bg); stroke: var(--line); stroke-width: 1; }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .both { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#a); marker-start: url(#a); }
    .dash { stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="720"/>
  <text class="title" x="30" y="44">Как устроен «Помощник по вакансиям»</text>
  <text class="m" x="30" y="66">Программа работает на вашем компьютере. В интернет уходит только то, что вы сами включили.</text>

  <!-- Окно -->
  <rect class="app" x="330" y="90" width="440" height="100" rx="10"/>
  <text class="h" x="350" y="116">Окно программы в браузере</text>
  <text class="t" x="350" y="140">вакансии по статусам, карточки, письма, контакты, статистика</text>
  <text class="m" x="350" y="162">открывается только на этом компьютере;</text>
  <text class="m" x="350" y="179">с телефона или ноутбука — в домашней сети, если включить</text>

  <!-- Программа -->
  <rect class="here" x="330" y="240" width="440" height="230" rx="10"/>
  <text class="h" x="350" y="266">Программа на вашем компьютере</text>
  <rect class="sub" x="350" y="282" width="195" height="54" rx="7"/>
  <text class="hs" x="362" y="304">Добавляет вакансии</text>
  <text class="m" x="362" y="323">и склеивает дубли</text>
  <rect class="sub" x="555" y="282" width="195" height="54" rx="7"/>
  <text class="hs" x="567" y="304">Разбирает и оценивает</text>
  <text class="m" x="567" y="323">по резюме и критериям</text>
  <rect class="sub" x="350" y="344" width="195" height="54" rx="7"/>
  <text class="hs" x="362" y="366">Пишет письма</text>
  <text class="m" x="362" y="385">и готовит к интервью</text>
  <rect class="sub" x="555" y="344" width="195" height="54" rx="7"/>
  <text class="hs" x="567" y="366">Ведёт отклики</text>
  <text class="m" x="567" y="385">этапы и контакты</text>
  <rect class="sub" x="350" y="406" width="400" height="50" rx="7"/>
  <text class="hs" x="362" y="428">Считает: статистика, зарплаты, рынок</text>
  <text class="m" x="362" y="446">компании и резюме против рынка — без модели</text>

  <!-- Источники -->
  <rect class="net" x="30" y="240" width="250" height="230" rx="10"/>
  <text class="h" x="46" y="266">Откуда вакансии</text>
  <text class="hs" x="46" y="294">hh.ru</text>
  <text class="t" x="46" y="313">письма Автопоиска,</text>
  <text class="t" x="46" y="331">сохранённая страница;</text>
  <text class="m" x="46" y="349">поиск на сайте — только если</text>
  <text class="m" x="46" y="365">вы включили его на свой риск</text>
  <text class="hs" x="46" y="391">Другие сайты</text>
  <text class="t" x="46" y="409">по ссылке, которую дали вы;</text>
  <text class="m" x="46" y="426">для ИТ — ленты Хабр Карьеры</text>
  <text class="m" x="46" y="441">и GeekJob, если вы их включили</text>
  <text class="hs" x="46" y="460">Любая вакансия <tspan class="t" font-weight="400">— текстом</tspan></text>

  <!-- Модель -->
  <rect class="here" x="820" y="240" width="250" height="230" rx="10"/>
  <text class="h" x="836" y="266">Модель — на выбор</text>
  <text class="hs" x="836" y="294">Локальная</text>
  <text class="t" x="836" y="313">на этом компьютере;</text>
  <text class="t" x="836" y="331">данные никуда не уходят</text>
  <rect class="net" x="828" y="345" width="234" height="66" rx="7"/>
  <text class="hs" x="840" y="366">GigaChat — в облаке Сбера</text>
  <text class="t" x="840" y="385">по вашему согласию;</text>
  <text class="t" x="840" y="402">имя, телефон, почта — метками</text>
  <text class="hs" x="836" y="436">Без модели</text>
  <text class="t" x="836" y="455">только трекер откликов</text>

  <!-- Данные -->
  <rect class="here" x="330" y="520" width="440" height="120" rx="10"/>
  <text class="h" x="350" y="546">Ваши данные — папка профиля</text>
  <text class="t" x="350" y="570">резюме, критерии, вакансии, разборы, письма, контакты</text>
  <text class="t" x="350" y="590">обычные текстовые файлы — их можно открыть и в Obsidian</text>
  <text class="m" x="350" y="614">резервная копия и перенос на другой компьютер — по кнопке</text>

  <!-- Служебное -->
  <rect class="net" x="820" y="520" width="250" height="120" rx="10"/>
  <text class="h" x="836" y="546">Служебные запросы</text>
  <text class="t" x="836" y="570">проверка обновлений —</text>
  <text class="t" x="836" y="588">раз в день, без данных о вас</text>
  <text class="t" x="836" y="612">курс ЦБ — для «Зарплат»</text>

  <!-- Стрелки -->
  <path class="both" d="M550,190 L550,240"/>
  <text class="lbl" x="560" y="220">вы работаете в окне</text>
  <path class="arrow" d="M280,355 L330,355"/>
  <path class="both" d="M770,355 L820,355"/>
  <path class="both" d="M550,470 L550,520"/>
  <text class="lbl" x="560" y="500">всё хранится здесь</text>
  <path class="arrow dash" d="M770,450 L820,530"/>

  <!-- Легенда -->
  <rect class="here" x="30" y="670" width="18" height="14" rx="3"/>
  <text class="m" x="56" y="682">на вашем компьютере</text>
  <rect class="net" x="210" y="670" width="18" height="14" rx="3"/>
  <text class="m" x="236" y="682">в интернете</text>
  <rect class="app" x="350" y="670" width="18" height="14" rx="3"/>
  <text class="m" x="376" y="682">окно программы</text>
</svg>
